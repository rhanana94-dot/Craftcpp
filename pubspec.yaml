name: ngodingyuk
description: "CraftC++ - Aplikasi pembelajaran C++ untuk belajar, latihan coding, dan evaluasi."
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ^3.13.2

dependencies:
    flutter:
        sdk: flutter

    shared_preferences: ^2.5.3

    # HTTP
    http: ^1.5.0

    # Cupertino
    cupertino_icons: ^1.0.8

    # Firebase
    firebase_core: ^3.4.0
    firebase_auth: ^5.2.0
    cloud_firestore: ^5.4.1

    # State Management & UI
    provider: ^6.1.2
    google_fonts: ^6.2.1
    flutter_svg: ^2.0.10+1
    lottie: ^3.1.2

    # YouTube
    youtube_player_iframe: ^5.2.0

    # Coding Editor
    code_text_field: ^1.1.0
    highlight: ^0.7.0
    flutter_highlight: ^0.7.0

    # Date & Time
    intl: ^0.20.3

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

    # App Icon
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true

    assets:
        - "assets/logo di hp.jpeg"
        - "assets/loading screan.jpeg"

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logo di hp.jpeg"